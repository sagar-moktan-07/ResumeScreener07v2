<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalized Candidates</title>
    <style>
        :root {
            --bg: #03110e;
            --panel: #112d29;
            --panel-strong: #163a35;
            --muted: #b1d0c4;
            --text: #edf8f3;
            --border: #234d47;
            --primary: #114d41;
            --success: #42c58a;
            --warning: #f7c875;
            --danger: #ff6b6b;
            --shadow-subtle: 0 12px 30px rgba(4, 15, 11, 0.5);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Inter, 'Segoe UI', system-ui, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        h1 { margin: 0; font-size: 1.4rem; }
        .nav {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .button-link {
            text-decoration: none;
            color: var(--text);
            background: var(--panel-strong);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 10px;
            font-weight: 700;
        }
        main { max-width: 1100px; margin: 32px auto; padding: 0 16px 40px; }
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            box-shadow: var(--shadow-subtle);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }
        th, td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            vertical-align: top;
        }
        th { color: var(--muted); }
        .badge {
            display: inline-block;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .approved { background: rgba(66, 197, 138, 0.12); color: var(--success); border: 1px solid rgba(66, 197, 138, 0.35); }
        .rejected { background: rgba(255, 107, 107, 0.12); color: var(--danger); border: 1px solid rgba(255, 107, 107, 0.35); }
        .recommended { background: rgba(31, 107, 86, 0.16); color: var(--text); border: 1px solid rgba(31, 107, 86, 0.45); }
        .shortlist { background: rgba(42, 138, 106, 0.12); color: var(--muted); border: 1px solid rgba(42, 138, 106, 0.35); }
        .action-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .action-row form { display: inline; }
        .action-button {
            border: 1px solid var(--border);
            background: var(--panel-strong);
            color: var(--text);
            border-radius: 8px;
            padding: 6px 10px;
            font-weight: 700;
            cursor: pointer;
        }
        .primary {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }
    </style>
</head>
<body>
    <header>
        <h1>Finalized candidates</h1>
        <div class="nav">
            <a class="button-link" href="/dashboard">Dashboard</a>
            <a class="button-link" href="/admin/users">Users</a>
            <a class="button-link" href="/admin/candidates">Candidates</a>
            <a class="button-link" href="/logout">Logout</a>
        </div>
    </header>

    <main>
        <div th:if="${message}" class="card" style="margin-bottom:16px;">
            <p th:text="${message}" style="margin:0; font-weight:700; color: var(--success);"></p>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Candidate ID</th>
                        <th>Vacancy</th>
                        <th>Candidate</th>
                        <th>Email</th>
                        <th>Score</th>
                        <th>AI conclusion</th>
                        <th>Decision</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${finalizedCandidates}">
                        <td th:text="${candidateCodeMap.get(item.candidateId) != null ? candidateCodeMap.get(item.candidateId) : 'Candidate ' + item.candidateId}">CAN-0001</td>
                        <td th:text="${vacancyMap.get(item.vacancyId) != null ? vacancyMap.get(item.vacancyId) : 'Vacancy ' + item.vacancyId}">Role</td>
                        <td th:text="${candidateNameMap.get(item.candidateId) != null ? candidateNameMap.get(item.candidateId) : 'Candidate ' + item.candidateId}">Candidate</td>
                        <td th:text="${candidateEmailMap.get(item.candidateId) != null ? candidateEmailMap.get(item.candidateId) : '-'}">email@example.com</td>
                        <td th:text="${#numbers.formatDecimal(item.finalScore, 1, 2)}">0.00</td>
                        <td th:text="${item.conclusion != null && !#strings.isEmpty(item.conclusion) ? item.conclusion : 'No conclusion recorded'}">No conclusion recorded</td>
                        <td>
                            <span class="badge" th:classappend="${item.decision == 'approved' ? 'approved' : (item.decision == 'rejected' ? 'rejected' : (item.decision == 'recommended' ? 'recommended' : 'shortlist'))}"
                                  th:text="${item.decision != null ? item.decision : 'pending'}">recommended</span>
                        </td>
                        <td>
                            <div class="action-row">
                                <form th:action="@{/admin/finalized/{id}/decision(id=${item.id})}" method="post">
                                    <input type="hidden" name="decision" value="approved">
                                    <button class="action-button primary" type="submit">Approve</button>
                                </form>
                                <form th:action="@{/admin/finalized/{id}/decision(id=${item.id})}" method="post">
                                    <input type="hidden" name="decision" value="rejected">
                                    <button class="action-button" type="submit">Reject</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
